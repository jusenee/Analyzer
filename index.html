<body>
<div class="wrap">
<h1>Spark Analyzer</h1>
<div class="version">VERSION 18.6 - SMART CURBSIDE + VISIBLE LOG</div>
<p class="note">Real Time only turns on for detail screenshots. Main screenshots use listed time.</p>

<div id="result" class="card result" style="display:none"></div>

<div class="card">
<label class="upload">📸 Analyze Screenshot<input id="file" type="file" accept="image/*"></label>
<p class="tiny">Best with one visible offer or detail page. If OCR misses, fix fields manually.</p>
<img id="preview" style="display:none">
<p id="status" class="status"></p><p id="modeNotice" class="tiny"></p>
</div>

<div class="card">
<h2>Check / Fix Details</h2>
<div class="grid">
<div><label class="small">Pay $</label><input id="pay" type="number" step="0.01"></div>
<div><label class="small">Miles</label><input id="miles" type="number" step="0.1"></div>
<div><label class="small">Total Mins</label><input id="minutes" type="number" step="1"></div>
</div>
<div class="grid" style="margin-top:8px">
<div><label class="small">Stops</label><input id="stops" type="number" step="1"></div>
<div><label class="small">Items</label><input id="items" type="number" step="1"></div>
<div></div>
</div>

<div class="grid" style="margin-top:8px">
<div><label class="small">Shopping Mins</label><input id="shoppingMinutes" type="number" step="1" value="15"></div>
<div><label class="small">Pickup Buffer</label><input id="pickupBuffer" type="number" step="1" value="5"></div>
<div style="display:flex;align-items:end">
<label style="font-weight:900;font-size:13px">
<input id="realMode" type="checkbox" checked style="margin-right:6px">
Real Time
</label>
</div>
</div>

<button onclick="analyze()">Recalculate</button>
<button onclick="readyForNextScreenshot()" class="secondary">Ready for Next Screenshot</button>
</div>

<div class="card">
<h2>Save This Order?</h2>
<div class="saveRow">
<button class="green" onclick="saveSimpleOrder('TAKEN')">TOOK IT</button>
<button class="red" onclick="saveSimpleOrder('SKIPPED')">SKIPPED IT</button>
</div>
<p id="saveStatus" class="status"></p>
</div>

<div class="card">
<h2>Simple Log</h2>
<div id="simpleSummary" class="summaryMetrics"></div>
<div id="simpleLog"></div>
<button onclick="clearSimpleLog()" class="secondary">Clear Simple Log</button>
</div>
</div>

<script>
let currentResult=null,currentImageData=null,currentScreenshotMode='main',currentOrderType='unknown';
const el=id=>document.getElementById(id);
const money=n=>"$"+Number(n).toFixed(2);

el("file").addEventListener("change",async e=>{
 const file=e.target.files&&e.target.files[0];
 if(!file)return;
 await processFile(file);
 e.target.value="";
});

["pay","miles","minutes","stops","items","shoppingMinutes","pickupBuffer","realMode"].forEach(id=>{
 el(id).addEventListener("input",analyze);
});

function fileToDataURL(file){
 return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(r.result);
  r.onerror=rej;
  r.readAsDataURL(file);
 });
}

async function processFile(file){
 clearFieldsOnly();
 currentImageData=await fileToDataURL(file);

 const url=URL.createObjectURL(file);
 el("preview").src=url;
 el("preview").style.display="block";
 el("status").textContent="Reading screenshot...";

 try{
   // Fast path: one OCR pass on uploaded file.
   const {data}=await Tesseract.recognize(file,"eng");
   const text=data.text||"";
   fillFromText(text, data.lines || []);
   updateRealTimeAvailability();
   analyze();
   el("modeNotice").textContent = currentScreenshotMode==="detail"
     ? "Detail screenshot detected: Real Time available."
     : "Smart curbside return mode + visible daily/weekly log.";
   el("status").textContent="Done. Verify fields if needed.";
 }catch(err){
   el("status").textContent="OCR failed. Type numbers manually.";
 }
}

function clean(s){
 return String(s||"")
 .replace(/[•·|]/g," • ")
 .replace(/[–—-]/g," • ")
 .replace(/,/g," , ")
 .replace(/\s+/g," ")
 .trim();
}

function parseTime(s){
 s=clean(s).toLowerCase();
 let m=s.match(/(\d+)\s*(?:hr|hrs|hour|hours).*?(\d+)\s*(?:min|mins|minute|minutes)/i);
 if(m)return parseInt(m[1])*60+parseInt(m[2]);
 m=s.match(/(\d+)\s*(?:hr|hrs|hour|hours)/i);
 if(m)return parseInt(m[1])*60;
 m=s.match(/(\d+)\s*(?:min|mins|minute|minutes)/i);
 if(m)return parseInt(m[1]);
 return null;
}

function formatDuration(totalMinutes){
 const mins=Math.round(Number(totalMinutes||0));
 if(mins<60)return `${mins} mins`;
 const h=Math.floor(mins/60),m=mins%60;
 return m?`${h} hr ${m} mins`:`${h} hr`;
}

function parseRoute(s){
 s=clean(s);
 let m=s.match(/(\d+)\s*stops?.{0,120}?(\d+(?:\.\d+)?)\s*miles?.{0,120}?((?:\d+\s*(?:hr|hrs|hour|hours).*?)?\d+\s*(?:min|mins|minute|minutes)|\d+\s*(?:hr|hrs|hour|hours))/i);
 if(!m)m=s.match(/(\d+)\s*stops?.{0,120}?(\d+(?:\.\d+)?)\s*mile\b.{0,120}?((?:\d+\s*(?:hr|hrs|hour|hours).*?)?\d+\s*(?:min|mins|minute|minutes)|\d+\s*(?:hr|hrs|hour|hours))/i);
 if(!m)return null;

 const minutes=parseTime(m[3]);
 if(minutes==null)return null;

 return {
   stops:parseInt(m[1]),
   miles:parseFloat(m[2]),
   minutes
 };
}

function parseItems(s){
 const m=clean(s).match(/(\d+)\s*items?/i);
 return m?parseInt(m[1]):null;
}


function parseShoppingTime(s){
 const text=clean(s).toLowerCase();

 // Examples:
 // "17 mins estimated shopping time"
 // "9 mins estimated shopping time"
 // "23 mins estimated shopping time"
 let m=text.match(/(\d+)\s*(?:min|mins|minute|minutes)\s+estimated\s+shopping\s+time/i);
 if(m)return parseInt(m[1]);

 // Fallback: sometimes OCR splits or adds odd spacing.
 m=text.match(/(\d+)\s*(?:min|mins|minute|minutes).{0,40}?shopping\s+time/i);
 if(m)return parseInt(m[1]);

 return null;
}

function firstPrice(s){
 const m=String(s||"").match(/\$\s*(\d{1,3}\.\d{2})/);
 return m?parseFloat(m[1]):null;
}


function lineText(line){
 return clean(line && line.text ? line.text : "");
}

function lineY(line, idx){
 const b = line && line.bbox ? line.bbox : {};
 if(typeof b.y0 === "number") return b.y0;
 if(typeof b.y === "number") return b.y;
 return idx * 20;
}

function getOCRLines(text, lines){
 let arr = (lines || []).map((line, idx) => ({
   text: lineText(line),
   y: lineY(line, idx)
 })).filter(x => x.text);

 if(!arr.length){
   arr = String(text || "").split(/\n+/).map((t, idx) => ({
     text: clean(t),
     y: idx * 20
   })).filter(x => x.text);
 }

 return arr.sort((a,b) => a.y - b.y);
}

function parsePriceFromLine(s){
 const m = String(s || "").match(/\$\s*(\d{1,3}\.\d{2})/);
 return m ? parseFloat(m[1]) : null;
}

function parseMainCardByPairs(text, lines){
 const arr = getOCRLines(text, lines);

 // Find each visible price line. For each price, only look below it until the next price.
 // This prevents bottom-card pay from being paired with top-card miles/time.
 for(let i=0; i<arr.length; i++){
   const pay = parsePriceFromLine(arr[i].text);
   if(pay === null) continue;

   let chunk = arr[i].text;

   for(let j=i+1; j<arr.length; j++){
     const nextPay = parsePriceFromLine(arr[j].text);
     if(nextPay !== null) break;

     // One offer card's route line should be close to the price.
     if(arr[j].y - arr[i].y > 260) break;

     chunk += " " + arr[j].text;

     const route = parseRoute(chunk);
     if(route){
       return {
         pay,
         stops: route.stops,
         miles: route.miles,
         minutes: route.minutes,
         items: parseItems(chunk),
         orderType: detectOrderType(chunk)
       };
     }
   }

   // If this price card didn't produce route info, return pay only
   // instead of stealing route info from another card.
   return {
     pay,
     stops: null,
     miles: null,
     minutes: null,
     items: null,
     orderType: detectOrderType(chunk)
   };
 }

 return null;
}


function detectOrderType(s){
 const text=clean(s).toLowerCase();

 if(/curbside\s+pickup/.test(text)) return "pickup";
 if(/\bpickup\b/.test(text) && !/express\s+shopping|shopping/.test(text)) return "pickup";
 if(/express\s+shopping|shopping/.test(text)) return "shopping";

 return "unknown";
}


function parseSingleVisibleCardFallback(s){
 const pay = firstPrice(s);
 const route = parseRoute(s);
 if(pay === null || !route) return null;

 return {
   pay,
   stops: route.stops,
   miles: route.miles,
   minutes: route.minutes,
   items: parseItems(s),
   orderType: detectOrderType(s)
 };
}


function parseMainLongTimeFallback(s){
 const text = clean(s);
 const pay = firstPrice(text);
 if(pay === null) return null;

 const route = parseRoute(text);
 if(!route) return null;

 return {
   pay,
   stops: route.stops,
   miles: route.miles,
   minutes: route.minutes,
   items: parseItems(text),
   orderType: detectOrderType(text)
 };
}


function parseDetailFallback(s){
 const text = clean(s);
 if(!/estimated\s+total/i.test(text)) return null;

 let pay = null;
 const afterEstimated = text.split(/estimated\s+total/i)[1] || text;
 const moneyMatches = [...afterEstimated.matchAll(/\$\s*(\d{1,3}\.\d{2})/g)];
 if(moneyMatches.length){
   pay = parseFloat(moneyMatches[0][1]);
 }else{
   pay = firstPrice(text);
 }

 const route = parseRoute(text);
 const items = parseItems(text);
 const shopTime = parseShoppingTime(text);
 const orderType = detectOrderType(text);

 if(pay === null && !route) return null;

 return {
   pay,
   stops: route ? route.stops : null,
   miles: route ? route.miles : null,
   minutes: route ? route.minutes : null,
   items,
   shoppingMinutes: shopTime,
   orderType
 };
}

function fillFromText(text, lines){
 const s=clean(text);
 currentScreenshotMode = /estimated\s+total/i.test(s) ? 'detail' : 'main';
 currentOrderType = currentScreenshotMode === 'detail' ? detectOrderType(s) : 'unknown';

 // Detail page: robust Estimated Total fallback.
 if(currentScreenshotMode === "detail"){
   const detail=parseDetailFallback(s);

   if(detail){
     if(detail.orderType) currentOrderType = detail.orderType;
     if(detail.pay!==null)el("pay").value=detail.pay.toFixed(2);
     if(detail.stops!==null)el("stops").value=detail.stops;
     if(detail.miles!==null)el("miles").value=detail.miles;
     if(detail.minutes!==null)el("minutes").value=detail.minutes;
     if(detail.items!==null)el("items").value=detail.items;

     if(currentOrderType==="pickup"){
       el("shoppingMinutes").value=0;
     } else if(currentOrderType==="shopping" && detail.shoppingMinutes!==null){
       el("shoppingMinutes").value=detail.shoppingMinutes;
     }

     return;
   }
 }

 // Main page: pair pay + route within the same visible card.
 if(el("shoppingMinutes")) el("shoppingMinutes").value=0;

 const main=parseMainCardByPairs(text, lines);
 if(main && main.pay!==null && main.miles!==null && main.minutes!==null){
   if(main.orderType) currentOrderType = main.orderType;
   if(main.pay!==null)el("pay").value=main.pay.toFixed(2);
   if(main.stops!==null)el("stops").value=main.stops;
   if(main.miles!==null)el("miles").value=main.miles;
   if(main.minutes!==null)el("minutes").value=main.minutes;
   if(main.items!==null)el("items").value=main.items;
   return;
 }

 const fallback=parseMainLongTimeFallback(s);
 if(fallback){
   currentOrderType = fallback.orderType || "unknown";
   el("pay").value=fallback.pay.toFixed(2);
   el("stops").value=fallback.stops;
   el("miles").value=fallback.miles;
   el("minutes").value=fallback.minutes;
   if(fallback.items!==null)el("items").value=fallback.items;
   return;
 }
}

function getSmartCurbsideReturnMinutes(miles){
 const m = Number(miles || 0);
 if(m <= 0) return 0;
 if(m < 8) return 15;
 if(m <= 15) return 25;
 if(m <= 25) return 35;
 return 35;
}

function getSmartCurbsideReturnLabel(miles){
 const m = Number(miles || 0);
 if(m < 8) return "8–15 min";
 if(m <= 15) return "15–25 min";
 if(m <= 25) return "25–35 min";
 return "35+ min";
}

function analyze(){
 const pay=parseFloat(el("pay").value);
 const miles=parseFloat(el("miles").value);
 const listedMinutes=parseFloat(el("minutes").value);
 const shoppingMinutes=parseFloat(el("shoppingMinutes").value||0);
 const pickupBuffer=parseFloat(el("pickupBuffer").value||0);
 const realMode=el("realMode").checked;
 const stops=parseFloat(el("stops").value||0);
 const items=parseFloat(el("items").value||0);

 if(!pay||!miles||!listedMinutes){
   el("result").style.display="none";
   currentResult=null;
   return null;
 }

 let finalMinutes=listedMinutes;
 let timeNote="";
 let returnDriveAdded=0;

 if(realMode){
   if(currentOrderType==="pickup"){
     returnDriveAdded=getSmartCurbsideReturnMinutes(miles);
     finalMinutes=listedMinutes + returnDriveAdded;
     timeNote=`${currentScreenshotMode==="detail" ? "Detail screenshot" : "Main screenshot"} • Curbside/Pickup • Listed ${formatDuration(listedMinutes)} • Return Dr. ${returnDriveAdded} mins added (${getSmartCurbsideReturnLabel(miles)})`;
   }else{
     const travelMinutes=Math.max(0, listedMinutes - shoppingMinutes);
     returnDriveAdded=travelMinutes;
     finalMinutes=shoppingMinutes + (travelMinutes * 2);
     timeNote=`${currentScreenshotMode==="detail" ? "Detail screenshot" : "Main screenshot"} • Listed ${formatDuration(listedMinutes)} • Shop ${shoppingMinutes} mins • Return Dr. ${returnDriveAdded} mins added`;
   }
 }else{
   finalMinutes=listedMinutes;
   timeNote=currentScreenshotMode==="detail" ? `Detail screenshot • Real Time OFF • Using listed time` : `Main screenshot • Real Time OFF • Using listed time`;
 }

 if(currentOrderType==="pickup" && pickupBuffer>0){
   finalMinutes += pickupBuffer;
   timeNote += ` • +${pickupBuffer} min pickup buffer`;
 }

 const rtMiles=miles*2;
 const rtPerMile=pay/rtMiles;
 const hourly=pay/(finalMinutes/60);

 const passHourly=hourly>=28;
 const softHourly=hourly>=24;
 const passRtMile=rtPerMile>=2;
 const softRtMile=rtPerMile>=1.75;
 const passLocal=miles<=5;

 let verdict="DECLINE";
 let cls="decline";

 if(passRtMile && passHourly){
   verdict="TAKE";
   cls="take";
 }else if(softRtMile && softHourly){
   verdict="SOFT YES";
   cls="soft";
 }

 currentResult={
  date:new Date().toLocaleString(),
  pay,
  miles,
  minutes:finalMinutes,
  listedMinutes,
  shoppingMinutes,
  returnDriveAdded,
  pickupBuffer,
  realMode,
  orderType:currentOrderType,
  stops,
  items,
  rtMiles,
  rtPerMile,
  hourly,
  verdict,
  screenshot:currentImageData
 };

 el("result").className="card result "+cls;
 el("result").style.display="block";
 el("result").innerHTML=`
 <button type="button" class="closeResult" onclick="hideResult()">×</button>
 <p class="verdict">${verdict}</p>
 <div class="metrics">
  <div class="metric ${passLocal ? 'metricPass' : 'metricFail'}"><div class="k">RT Miles</div><div class="v">${rtMiles.toFixed(1)}</div></div>
  <div class="metric ${(passRtMile || softRtMile) ? 'metricPass' : 'metricFail'}"><div class="k">RT $/Mile</div><div class="v">${money(rtPerMile)}</div></div>
  <div class="metric ${(passHourly || softHourly) ? 'metricPass' : 'metricFail'}"><div class="k">Hourly</div><div class="v">${money(hourly)}/hr</div></div>
  <div class="metric ${softHourly ? 'metricPass' : 'metricFail'}"><div class="k">Real Time</div><div class="v">${formatDuration(finalMinutes)}</div></div>
 </div>
 <div style="margin-top:10px;font-size:12px;font-weight:700;opacity:.75">
 ${timeNote}
 </div>`;
 return currentResult;
}

function saveSimpleOrder(status){
 const result = analyze();
 if(!result){
   el("saveStatus").textContent = "Fill pay, miles, and time first.";
   return;
 }

 const entry = {
   id: Date.now(),
   date: new Date().toISOString(),
   status,
   verdict: result.verdict,
   pay: result.pay,
   miles: result.miles,
   minutes: result.minutes,
   listedMinutes: result.listedMinutes,
   shoppingMinutes: result.shoppingMinutes,
   returnDriveAdded: result.returnDriveAdded || 0,
   pickupBuffer: result.pickupBuffer || 0,
   rtMiles: result.rtMiles,
   rtPerMile: result.rtPerMile,
   hourly: result.hourly
 };

 const log = getSimpleLog();
 log.unshift(entry);
 setSimpleLog(log);

 el("saveStatus").textContent = status === "TAKEN" ? "Saved: Took this order." : "Saved: Skipped this order.";
}


function getWeekEndingSunday(dateInput){
 const d = new Date(dateInput);
 if(isNaN(d.getTime())) return "";
 const end = new Date(d);
 const day = end.getDay(); // 0 = Sunday
 const add = (7 - day) % 7;
 end.setDate(end.getDate() + add);
 return end.toLocaleDateString([], {month:"numeric", day:"numeric", year:"numeric"});
}

function formatLogDayWithWeek(dateInput){
 const base = formatLogDay(dateInput);
 const weekEnd = getWeekEndingSunday(dateInput);
 if(base === "Today" || base === "Yesterday"){
   return `${base} • Week ending ${weekEnd}`;
 }
 return `${base} • Week ending ${weekEnd}`;
}


function getWeekStartMonday(dateInput){
 const d = new Date(dateInput);
 const start = new Date(d);
 const day = start.getDay(); // 0 Sunday, 1 Monday
 const diff = day === 0 ? -6 : 1 - day;
 start.setDate(start.getDate() + diff);
 start.setHours(0,0,0,0);
 return start;
}

function getWeekEndSunday(dateInput){
 const start = getWeekStartMonday(dateInput);
 const end = new Date(start);
 end.setDate(start.getDate() + 6);
 end.setHours(23,59,59,999);
 return end;
}

function getWeekKey(dateInput){
 const end = getWeekEndSunday(dateInput);
 return end.getFullYear()+"-"+String(end.getMonth()+1).padStart(2,"0")+"-"+String(end.getDate()).padStart(2,"0");
}

function getWeekLabel(dateInput){
 const start = getWeekStartMonday(dateInput);
 const end = getWeekEndSunday(dateInput);
 const startText = start.toLocaleDateString([], {month:"numeric", day:"numeric"});
 const endText = end.toLocaleDateString([], {month:"numeric", day:"numeric", year:"numeric"});
 return `${startText}–${endText}`;
}

function summarizeEntries(entries){
 const taken = entries.filter(x=>x.status==="TAKEN");
 const skipped = entries.filter(x=>x.status==="SKIPPED");
 const takenPay = taken.reduce((sum,x)=>sum+Number(x.pay||0),0);
 const avgHr = taken.length ? taken.reduce((sum,x)=>sum+Number(x.hourly||0),0)/taken.length : 0;
 return {total:entries.length, taken:taken.length, skipped:skipped.length, takenPay, avgHr};
}


function getCollapsedDays(){
 try{return JSON.parse(localStorage.getItem("sparkCollapsedDaysV18_6")||"{}")}
 catch{return{}}
}
function setCollapsedDays(obj){
 localStorage.setItem("sparkCollapsedDaysV18_6", JSON.stringify(obj));
}
function toggleLogDay(dayKey){
 const collapsed = getCollapsedDays();
 collapsed[dayKey] = !collapsed[dayKey];
 setCollapsedDays(collapsed);
 renderSimpleLog();
}
function renderSimpleLog(){
 const log = getSimpleLog();
 const todayKey = makeLogDateKey(new Date().toISOString());
 const todayEntries = log.filter(x=>makeLogDateKey(x.date)===todayKey);
 const todaySummary = summarizeEntries(todayEntries);
 const currentWeekKey = getWeekKey(new Date().toISOString());
 const weekEntries = log.filter(x=>getWeekKey(x.date)===currentWeekKey);
 const weekSummary = summarizeEntries(weekEntries);

 if(el("simpleSummary")){
   el("simpleSummary").className = "simpleSummaryGrid";
   el("simpleSummary").innerHTML = `
   <div class="summaryBox"><div class="head">Today<br>Saved</div><div class="num">${todaySummary.total}</div></div>
   <div class="summaryBox"><div class="head">Today<br>Taken</div><div class="num">${todaySummary.taken}</div></div>
   <div class="summaryBox"><div class="head">Today<br>Skipped</div><div class="num">${todaySummary.skipped}</div></div>
   <div class="summaryBox"><div class="head">Today<br>Pay</div><div class="num">${money(todaySummary.takenPay)}</div></div>`;
 }

 if(el("simpleLog")){
   const collapsed = getCollapsedDays();
   const groups = {};
   log.slice(0,100).forEach(x=>{
     const key = makeLogDateKey(x.date);
     if(!groups[key]) groups[key] = [];
     groups[key].push(x);
   });

   let logHtml = `
     <div class="weekSummary">
       <div class="weekSummaryTitle">This Week • ${getWeekLabel(new Date().toISOString())} • Ends Sunday</div>
       <div class="weekSummaryGrid">
         <div class="weekMini"><div class="head">Taken Pay</div><div class="num">${money(weekSummary.takenPay)}</div></div>
         <div class="weekMini"><div class="head">Taken</div><div class="num">${weekSummary.taken}</div></div>
         <div class="weekMini"><div class="head">Skipped</div><div class="num">${weekSummary.skipped}</div></div>
       </div>
     </div>`;

   if(!log.length){
     logHtml += `<div class="logEmpty">No saved orders yet.</div>`;
   }

   Object.keys(groups).forEach((key)=>{
     const entries = groups[key];
     const label = formatLogDay(entries[0].date);
     const isToday = label === "Today";
     const isCollapsed = collapsed[key] === undefined ? !isToday : collapsed[key];
     const daySummary = summarizeEntries(entries);

     logHtml += `
       <div class="logDayGroup ${isCollapsed ? 'collapsed' : ''}">
         <div class="logDayHeader" onclick="toggleLogDay('${key}')">
           <span>${label} (${entries.length})</span>
           <span class="dayTotalLine">${money(daySummary.takenPay)} taken</span>
           <span class="dayToggle">${isCollapsed ? '+' : '−'}</span>
         </div>
         <div class="dayBody">`;

     entries.forEach(x=>{
       const cls = x.status==="TAKEN" ? "logItemTaken" : "logItemSkipped";
       const statusText = x.status==="TAKEN" ? "Took it" : "Skipped it";
       const shortTime = formatLogTime(x.date);
       logHtml += `
         <div class="logItem ${cls}">
           <div class="logTopLine">
             <div class="logMain">${statusText} • ${x.verdict}</div>
             <div class="logTime">${shortTime}</div>
           </div>
           <div class="logStats">${money(x.pay)} • ${Number(x.miles).toFixed(1)} mi • ${formatDuration(x.minutes)} • ${money(x.hourly)}/hr</div>
           <div class="logTiny">RT ${Number(x.rtMiles).toFixed(1)} mi • ${money(x.rtPerMile)}/RT mi</div>
         </div>`;
     });

     logHtml += `</div></div>`;
   });

   el("simpleLog").innerHTML = logHtml;
 }
}
