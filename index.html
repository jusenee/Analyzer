<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Analyzer v14</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:14px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f6f7fb; color:#111827; }
    .wrap { max-width:500px; margin:0 auto 40px; }
    h1 { font-size:24px; margin:8px 0 2px; text-align:center; }
    h2 { font-size:18px; margin:0 0 12px; }
    p { color:#4b5563; line-height:1.35; }
    .note { font-size:13px; color:#64748b; text-align:center; margin:4px 0 10px; }
    .card { background:white; border-radius:18px; padding:14px; margin:12px 0; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .upload { display:block; border:2px dashed #cbd5e1; border-radius:18px; padding:20px; text-align:center; font-weight:900; background:#fff; font-size:18px; }
    .oneTap { padding:26px; font-size:22px; background:#111827; color:white; border-color:#111827; }
    input[type=file] { display:none; }
    img { width:100%; max-height:300px; object-fit:contain; border-radius:14px; background:#eef2f7; margin-top:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label.small { font-size:11px; font-weight:900; color:#475569; text-transform:uppercase; letter-spacing:.02em; }
    input[type=number] { width:100%; padding:12px 10px; border:1px solid #cbd5e1; border-radius:12px; font-size:18px; margin-top:4px; font-weight:800; }
    button { width:100%; border:0; border-radius:14px; padding:14px; font-weight:950; font-size:16px; background:#111827; color:white; margin-top:9px; }
    .secondary { background:#e5e7eb; color:#111827; }
    .danger { background:#fee2e2; color:#991b1b; }
    .green { background:#16a34a; color:white; }
    .red { background:#dc2626; color:white; }
    .toggle { background:#e5e7eb; color:#111827; }
    .toggle.on { background:#fde68a; color:#111827; }
    .result { border:2px solid; position:sticky; top:0; z-index:2; }
    .take { background:#ecfdf5; border-color:#86efac; color:#065f46; }
    .soft { background:#fffbeb; border-color:#fde68a; color:#92400e; }
    .decline { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
    .verdict { font-size:32px; font-weight:1000; margin:0; line-height:1; }
    .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
    .result .metrics { grid-template-columns:1fr 1fr; }
    .metric { background:rgba(255,255,255,.72); border-radius:14px; padding:10px; }
    .metric .k { font-size:11px; opacity:.75; font-weight:900; text-transform:uppercase; }
    .metric .v { font-size:16px; font-weight:1000; margin-top:2px; }
    .ocr { max-height:105px; overflow:auto; white-space:pre-wrap; font-size:12px; background:#f1f5f9; padding:10px; border-radius:12px; }
    .status { font-size:14px; font-weight:900; text-align:center; color:#334155; }
    .historyItem { cursor:pointer; border-radius:12px; padding:12px; margin:8px 0; background:#f8fafc; border-top:1px solid #e5e7eb; font-size:14px; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:900; margin-right:5px; }
    .bTake { background:#dcfce7; color:#166534; }
    .bSkip { background:#fee2e2; color:#991b1b; }
    .bVerdict { background:#e0e7ff; color:#3730a3; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .tab { background:#e5e7eb; color:#111827; margin-top:0; }
    .tab.active { background:#111827; color:white; }
    .tiny { font-size:12px; color:#64748b; margin:6px 0 0; }
    .detailOverlay { position:fixed; inset:0; background:rgba(15,23,42,.62); z-index:99; display:none; align-items:flex-end; }
    .detailPanel { width:100%; max-height:88vh; overflow:auto; background:white; border-radius:22px 22px 0 0; padding:16px; }
    .detailImg { width:100%; max-height:430px; object-fit:contain; background:#eef2f7; border-radius:16px; margin:12px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Spark Analyzer v14</h1>
  <p class="note">Position-aware parsing: matches top order price to top route line.</p>

  <div id="result" class="card result" style="display:none;"></div>

  <div class="card">
    <label class="upload oneTap">
      📸 Analyze Screenshot
      <input id="file" type="file" accept="image/*" />
    </label>
    <p class="tiny">Tap this, choose the newest Spark screenshot, and the app analyzes it automatically.</p>
    <img id="preview" style="display:none;" />
    <p id="status" class="status"></p>
    <div id="ocr" class="ocr" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Check / Fix Details</h2>
    <div class="grid">
      <div><label class="small">Pay $</label><input id="pay" type="number" step="0.01" placeholder="25"></div>
      <div><label class="small">Miles</label><input id="miles" type="number" step="0.1" placeholder="5"></div>
      <div><label class="small">Total Mins</label><input id="minutes" type="number" step="1" placeholder="30"></div>
    </div>
    <div class="grid" style="margin-top:8px;">
      <div><label class="small">Stops</label><input id="stops" type="number" step="1" placeholder="2"></div>
      <div><label class="small">Items</label><input id="items" type="number" step="1" placeholder="optional"></div>
      <button id="apt" class="toggle" type="button">Apt: No</button>
    </div>
    <button onclick="analyze()">Recalculate</button>
    <button onclick="clearForNext()" class="secondary">Ready for Next Screenshot</button>
  </div>

  <div class="card">
    <h2>Did you take this order?</h2>
    <div class="grid2">
      <button class="green" onclick="logOrder('TAKEN')">Yes, I took it</button>
      <button class="red" onclick="logOrder('SKIPPED')">No, I skipped it</button>
    </div>
  </div>

  <div class="card">
    <h2>My Order Tracker</h2>
    <div id="summary" class="metrics"></div>
    <button onclick="exportHistory()" class="secondary">Copy History CSV</button>
    <button onclick="clearHistory()" class="danger">Clear History</button>
    <div id="history"></div>
  </div>
</div>

<div id="detailOverlay" class="detailOverlay" onclick="closeDetail(event)">
  <div class="detailPanel" onclick="event.stopPropagation()">
    <div id="detailContent"></div>
    <button onclick="hideDetail()">Close</button>
  </div>
</div>

<script>
let apartment = false, currentResult = null, currentImageData = null, orderType = "";
const el = id => document.getElementById(id);
const money = n => "$" + Number(n).toFixed(2);

el("apt").onclick = function(){ apartment=!apartment; updateAptButton(); analyze(); };
["pay","miles","minutes","stops","items"].forEach(id => el(id).addEventListener("input", analyze));
el("file").addEventListener("change", async e => { const file=e.target.files&&e.target.files[0]; if(!file)return; await processFile(file); e.target.value=""; });

function fileToDataURL(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }

async function processFile(file){
  clearFieldsOnly();
  const url=URL.createObjectURL(file);
  currentImageData = await fileToDataURL(file);
  el("preview").src=url; el("preview").style.display="block";
  el("result").style.display="none"; el("ocr").style.display="none"; el("ocr").textContent="";
  el("status").textContent="Reading screenshot...";
  try{
    const {data}=await Tesseract.recognize(file,"eng");
    const text=data.text||"";
    el("ocr").style.display="block"; el("ocr").textContent=text||"No text detected.";
    fillFromText(text, data.lines || []);
    el("status").textContent="Done. Verify fields if needed.";
    analyze();
    window.scrollTo({top:0, behavior:"smooth"});
  } catch(err){ el("status").textContent="OCR failed. Use speed input fields."; }
}

function normalizeText(text){
  return String(text || "")
    .replace(/[•·|]/g," • ")
    .replace(/[–—]/g," - ")
    .replace(/\s+/g," ")
    .replace(/\bO\b/g,"0")
    .trim();
}

function formatDuration(totalMinutes){
  const mins=Math.round(Number(totalMinutes||0));
  if(mins < 60) return `${mins} mins`;
  const h=Math.floor(mins/60), m=mins%60;
  const hourLabel = h === 1 ? "hr" : "hrs";
  if(!m) return `${h} ${hourLabel}`;
  return `${h} ${hourLabel} ${m} mins`;
}

function parseTimeChunk(timeText){
  if(!timeText) return null;
  const t = String(timeText).toLowerCase().replace(/,/g, " ").replace(/\s+/g, " ").trim();

  let m = t.match(/(\d+)\s*(?:hr|hrs|hour|hours)\s*(\d+)\s*(?:min|mins|minute|minutes)/i);
  if(m) return parseInt(m[1],10) * 60 + parseInt(m[2],10);

  m = t.match(/(\d+)\s*(?:hr|hrs|hour|hours)\b/i);
  if(m) return parseInt(m[1],10) * 60;

  m = t.match(/(\d+)\s*(?:min|mins|minute|minutes)\b/i);
  if(m) return parseInt(m[1],10);

  return null;
}

function parseHeaderFromText(text){
  const t = normalizeText(text);

  const patterns = [
    /(\d+)\s*stops?.{0,60}?(\d+(?:\.\d+)?)\s*miles?.{0,60}?((?:\d+\s*(?:hr|hrs|hour|hours)\s*,?\s*)?(?:\d+\s*(?:min|mins|minute|minutes))|\d+\s*(?:hr|hrs|hour|hours))/i,
    /(\d+)\s*stops?.{0,60}?(\d+(?:\.\d+)?)\s*mile\b.{0,60}?((?:\d+\s*(?:hr|hrs|hour|hours)\s*,?\s*)?(?:\d+\s*(?:min|mins|minute|minutes))|\d+\s*(?:hr|hrs|hour|hours))/i
  ];

  for(const pattern of patterns){
    const m = t.match(pattern);
    if(!m) continue;
    const minutes = parseTimeChunk(m[3]);
    if(minutes === null) continue;
    return {
      stops: parseInt(m[1], 10),
      miles: parseFloat(m[2]),
      minutes
    };
  }
  return null;
}

function parsePayFromText(text){
  // CRITICAL: Pay ONLY comes from a number with $ in front.
  const m = String(text || "").match(/\$\s*(\d+(?:\.\d{1,2})?)/);
  if(!m) return null;
  return parseFloat(m[1]);
}

function parseMilesFromText(text){
  const m = String(text || "").match(/(\d+(?:\.\d+)?)\s*miles?\b/i);
  if(!m) return null;
  return parseFloat(m[1]);
}

function parseStopsFromText(text){
  const m = String(text || "").match(/(\d+)\s*stops?\b/i);
  if(!m) return null;
  return parseInt(m[1], 10);
}

function parseTimeFromText(text){
  let m = String(text || "").match(/(\d+\s*(?:hr|hrs|hour|hours)\s*,?\s*\d+\s*(?:min|mins|minute|minutes))/i);
  if(m) return parseTimeChunk(m[1]);

  m = String(text || "").match(/(\d+\s*(?:hr|hrs|hour|hours)\b)/i);
  if(m) return parseTimeChunk(m[1]);

  m = String(text || "").match(/(\d+\s*(?:min|mins|minute|minutes)\b)/i);
  if(m) return parseTimeChunk(m[1]);

  return null;
}

function parseItemsFromText(text){
  const itemQtyMatch = String(text || "").match(/(\d+)\s*items?\s*\((\d+)\s*qty\)/i);
  if(itemQtyMatch) return parseInt(itemQtyMatch[1], 10);

  const m = String(text || "").match(/(\d+)\s*items?\b/i);
  if(m) return parseInt(m[1], 10);

  return null;
}

function getLineText(line){
  return normalizeText(line?.text || "");
}

function getLineY(line){
  return line?.bbox?.y0 ?? line?.bbox?.y ?? 999999;
}

function getLineX(line){
  return line?.bbox?.x0 ?? line?.bbox?.x ?? 999999;
}

function parseWithPositionedLines(rawText, lines){
  const positioned = (lines || [])
    .map((line, idx) => ({
      idx,
      text: getLineText(line),
      y: getLineY(line),
      x: getLineX(line)
    }))
    .filter(line => line.text)
    .sort((a,b) => a.y - b.y || a.x - b.x);

  // Route line must contain stops, miles, and time. Pick top-most one.
  let routeLine = null;
  for(const line of positioned){
    const parsed = parseHeaderFromText(line.text);
    if(parsed){
      routeLine = { ...line, parsed };
      break;
    }
  }

  // If route info is split across two nearby OCR lines, combine neighbors.
  if(!routeLine){
    for(let i=0; i<positioned.length; i++){
      const chunk = [positioned[i], positioned[i+1], positioned[i+2]].filter(Boolean);
      const text = chunk.map(x => x.text).join(" ");
      const parsed = parseHeaderFromText(text);
      if(parsed){
        routeLine = {
          text,
          y: Math.min(...chunk.map(x => x.y)),
          parsed
        };
        break;
      }
    }
  }

  if(!routeLine) return null;

  // Pay must be a $ amount, and for a main offer card the correct price is the nearest $ ABOVE the route line.
  const priceLinesAbove = positioned
    .filter(line => /\$\s*\d+(?:\.\d{1,2})?/.test(line.text) && line.y <= routeLine.y + 8)
    .sort((a,b) => Math.abs(routeLine.y - b.y) - Math.abs(routeLine.y - a.y));

  let price = null;
  if(priceLinesAbove.length){
    // nearest above route line is last visually before route.
    const nearest = priceLinesAbove.sort((a,b) => (routeLine.y - a.y) - (routeLine.y - b.y))[0];
    price = parsePayFromText(nearest.text);
  }

  // Detail pages may have route line above pay. If no price above, use first $ after "Estimated Total".
  if(price === null){
    const cleaned = normalizeText(rawText);
    const estimated = cleaned.match(/estimated\s+total.{0,120}?\$\s*(\d+(?:\.\d{1,2})?)/i);
    if(estimated) price = parseFloat(estimated[1]);
  }

  if(price === null) return null;

  return {
    pay: price,
    stops: routeLine.parsed.stops,
    miles: routeLine.parsed.miles,
    minutes: routeLine.parsed.minutes
  };
}

function getTopFullyVisibleOrderText(rawText){
  const cleaned = normalizeText(rawText);
  const dollars = [...cleaned.matchAll(/\$\s*\d+(?:\.\d{1,2})?/g)].map(m => m.index);

  if(dollars.length === 0) return cleaned;

  let start = dollars[0];
  const beforeFirst = cleaned.slice(0, start);
  const justForYou = beforeFirst.toLowerCase().lastIndexOf("just for you");
  if(justForYou >= 0 && start - justForYou < 250) start = justForYou;

  const estimatedTotal = beforeFirst.toLowerCase().lastIndexOf("estimated total");
  if(estimatedTotal >= 0 && dollars[0] - estimatedTotal < 250) start = Math.min(start, estimatedTotal);

  let slice = cleaned.slice(start);
  const nextDollars = [...slice.matchAll(/\$\s*\d+(?:\.\d{1,2})?/g)].map(m => m.index);

  if(nextDollars.length >= 2){
    const secondDollarIndex = nextDollars[1];
    const firstPart = slice.slice(0, secondDollarIndex);
    const hasRouteBeforeSecond = /stops?.{0,160}?miles?.{0,160}?(?:hr|hrs|hour|hours|min|mins|minute|minutes)/i.test(firstPart);
    if(hasRouteBeforeSecond) slice = firstPart;
  }

  return slice;
}

function fillFromText(text, lines){
  // First try position-aware OCR lines to avoid mixing top order miles/time with bottom order price.
  const positioned = parseWithPositionedLines(text, lines);
  if(positioned){
    el("pay").value = positioned.pay.toFixed(2);
    el("miles").value = positioned.miles;
    el("minutes").value = positioned.minutes;
    el("stops").value = positioned.stops;
  } else {
    const cleaned = normalizeText(text);
    const orderText = getTopFullyVisibleOrderText(cleaned);

    const pay = parsePayFromText(orderText);
    if(pay !== null) el("pay").value = pay.toFixed(2);

    const header = parseHeaderFromText(orderText);
    if(header){
      el("miles").value = header.miles;
      el("minutes").value = header.minutes;
      el("stops").value = header.stops;
    } else {
      const miles = parseMilesFromText(orderText);
      if(miles !== null) el("miles").value = miles;

      const minutes = parseTimeFromText(orderText);
      if(minutes !== null) el("minutes").value = minutes;

      const stops = parseStopsFromText(orderText);
      if(stops !== null) el("stops").value = stops;
    }
  }

  const cleanedAll = normalizeText(text);
  const items = parseItemsFromText(cleanedAll);
  if(items !== null) el("items").value = items;

  apartment = /apartment|apt|unit|building|floor/i.test(cleanedAll);
  orderType = "";
  updateAptButton();
}
function updateAptButton(){ el("apt").textContent="Apt: "+(apartment?"Yes":"No"); el("apt").className="toggle"+(apartment?" on":""); }

function analyze(){
  const pay=parseFloat(el("pay").value), miles=parseFloat(el("miles").value), minutes=parseFloat(el("minutes").value), stops=parseFloat(el("stops").value||"0"), items=parseFloat(el("items").value||"0");
  if(!pay||!miles||!minutes){ currentResult=null; el("result").style.display="none"; return; }
  const roundTripMiles=miles*2, minPayByMiles=miles*4, oneWayPerMile=pay/miles, roundTripPerMile=pay/roundTripMiles, hourly=pay/(minutes/60);
  const passesMileage=pay>=minPayByMiles, passesHourly=hourly>=30, local=miles<=5;
  const isCurbsideLike=orderType==="curbside"||orderType==="pickup", manyStops=stops>=4, risky=apartment||manyStops||items>=40;
  const curbsideStrongEnough=!isCurbsideLike||stops<=2||hourly>=40||pay>=25;
  let verdict="DECLINE", cls="decline", reason="Fails your pay, time, or distance rules.";
  if(passesMileage&&passesHourly&&local&&!risky&&curbsideStrongEnough){ verdict="TAKE"; cls="take"; reason="Clean local order with strong hourly and round-trip mileage."; }
  else if(passesMileage&&passesHourly&&local&&curbsideStrongEnough){ verdict="SOFT YES"; cls="soft"; reason="Money works, but stops/items/apartment risk may slow you down."; }
  else if(passesMileage&&passesHourly&&local&&isCurbsideLike&&manyStops){ verdict="SOFT YES"; cls="soft"; reason="Curbside multi-stop: hourly looks okay, but pickup/drop-off risk makes it borderline."; }
  else if(passesMileage&&passesHourly&&miles<=7&&minutes<=25&&pay>=20&&curbsideStrongEnough){ verdict="SOFT YES"; cls="soft"; reason="Money works, but it is outside your ideal zone."; }
  else if(hourly>=35&&minutes<=25&&pay>=15&&miles<=5&&!isCurbsideLike){ verdict="SOFT YES"; cls="soft"; reason="Hourly pace is good, but it may not fully satisfy every rule."; }

  currentResult={date:new Date().toLocaleString(),pay,miles,minutes,stops,items,apartment,orderType,roundTripMiles,minPayByMiles,oneWayPerMile,roundTripPerMile,hourly,verdict,reason,screenshot:currentImageData};
  el("result").className="card result "+cls; el("result").style.display="block";
  el("result").innerHTML=`<p class="verdict">${verdict}</p><div class="metrics">
    <div class="metric"><div class="k">RT Miles</div><div class="v">${roundTripMiles.toFixed(1)}</div></div>
    <div class="metric"><div class="k">RT $/Mile</div><div class="v">${money(roundTripPerMile)}</div></div>
    <div class="metric"><div class="k">Hourly</div><div class="v">${money(hourly)}/hr</div></div>
    <div class="metric"><div class="k">Time</div><div class="v">${formatDuration(minutes)}</div></div>
  </div>`;
}

function getHistory(){ try{return JSON.parse(localStorage.getItem("sparkHistoryV9")||"[]");}catch{return[];} }
function saveHistory(h){ localStorage.setItem("sparkHistoryV9",JSON.stringify(h)); renderHistory(); }
function logOrder(status){ if(!currentResult){alert("Analyze an order first.");return;} const h=getHistory(); h.unshift({...currentResult,status,id:Date.now()}); saveHistory(h); clearForNext(); }
function renderHistory(){
  const h=getHistory(), taken=h.filter(x=>x.status==="TAKEN"), skipped=h.filter(x=>x.status==="SKIPPED");
  const avg=taken.length?taken.reduce((a,b)=>a+b.hourly,0)/taken.length:0, total=taken.reduce((a,b)=>a+b.pay,0);
  el("summary").innerHTML=`<div class="metric"><div class="k">Analyzed</div><div class="v">${h.length}</div></div><div class="metric"><div class="k">Taken</div><div class="v">${taken.length}</div></div><div class="metric"><div class="k">Skipped</div><div class="v">${skipped.length}</div></div><div class="metric"><div class="k">Taken Pay</div><div class="v">${money(total)}</div></div><div class="metric"><div class="k">Avg Taken/hr</div><div class="v">${taken.length?money(avg):"$0.00"}</div></div><div class="metric"><div class="k">Take Rate</div><div class="v">${h.length?Math.round(taken.length/h.length*100):0}%</div></div>`;
  el("history").innerHTML=h.slice(0,25).map((x,i)=>`<div class="historyItem" onclick="showDetail(${i})"><span class="badge ${x.status==="TAKEN"?"bTake":"bSkip"}">${x.status}</span><span class="badge bVerdict">${x.verdict}</span><b>${money(x.pay)}</b> • ${x.miles} mi • ${formatDuration(x.minutes)} • ${money(x.hourly)}/hr<div class="tiny">Tap to view screenshot + breakdown</div><div class="tiny">${x.date} ${x.orderType?"• "+x.orderType:""} ${x.apartment?"• Apartment":""} ${x.items?"• "+x.items+" items":""}</div></div>`).join("");
}
function showDetail(i){ const x=getHistory()[i]; if(!x)return; const img=x.screenshot?`<img class="detailImg" src="${x.screenshot}">`:`<div class="card">No screenshot saved.</div>`; el("detailContent").innerHTML=`<h2>Trip Breakdown</h2><p><span class="badge ${x.status==="TAKEN"?"bTake":"bSkip"}">${x.status}</span><span class="badge bVerdict">${x.verdict}</span></p>${img}<div class="metrics"><div class="metric"><div class="k">Pay</div><div class="v">${money(x.pay)}</div></div><div class="metric"><div class="k">Time</div><div class="v">${formatDuration(x.minutes)}</div></div><div class="metric"><div class="k">Hourly</div><div class="v">${money(x.hourly)}/hr</div></div><div class="metric"><div class="k">Miles</div><div class="v">${Number(x.miles).toFixed(1)}</div></div><div class="metric"><div class="k">RT Miles</div><div class="v">${Number(x.roundTripMiles).toFixed(1)}</div></div><div class="metric"><div class="k">RT $/Mile</div><div class="v">${money(x.roundTripPerMile)}</div></div><div class="metric"><div class="k">Stops</div><div class="v">${x.stops||0}</div></div><div class="metric"><div class="k">Items</div><div class="v">${x.items||"—"}</div></div></div><p class="tiny">${x.date}</p><p class="tiny">${x.reason||""}</p>`; el("detailOverlay").style.display="flex"; }
function hideDetail(){ el("detailOverlay").style.display="none"; }
function closeDetail(e){ if(e.target.id==="detailOverlay")hideDetail(); }
function exportHistory(){ const h=getHistory(); if(!h.length){alert("No history yet.");return;} const rows=[["date","status","verdict","pay","miles","minutes","stops","items","type","apartment","hourly","roundTripPerMile"],...h.map(x=>[x.date,x.status,x.verdict,x.pay,x.miles,x.minutes,x.stops,x.items,x.orderType,x.apartment,x.hourly.toFixed(2),x.roundTripPerMile.toFixed(2)])]; const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"); navigator.clipboard.writeText(csv).then(()=>alert("History CSV copied.")); }
function clearHistory(){ if(confirm("Clear all saved order history?")){localStorage.removeItem("sparkHistoryV9");renderHistory();} }
function clearFieldsOnly(){ ["pay","miles","minutes","stops","items"].forEach(id=>el(id).value=""); apartment=false; orderType=""; updateAptButton(); currentResult=null; currentImageData=null; }
function clearForNext(){ clearFieldsOnly(); el("preview").style.display="none"; el("ocr").style.display="none"; el("ocr").textContent=""; el("status").textContent=""; el("result").style.display="none"; el("file").value=""; }
renderHistory();
</script>
</body>
