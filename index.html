<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spark Analyzer V11 OCR Quality</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#111827}
.wrap{max-width:500px;margin:0 auto 40px}
h1{font-size:26px;text-align:center;margin:8px 0 2px}
.version{text-align:center;font-size:14px;font-weight:900;color:#2563eb;margin-bottom:6px}
.note,.tiny{font-size:13px;color:#64748b;text-align:center}
.card{background:#fff;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.upload{display:block;border:2px dashed #111827;border-radius:18px;padding:26px;text-align:center;font-weight:1000;background:#111827;color:white;font-size:22px}
input[type=file]{display:none}
img{width:100%;max-height:320px;object-fit:contain;border-radius:16px;background:#eef2f7;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.small{font-size:11px;font-weight:900;color:#475569;text-transform:uppercase}
input[type=number]{width:100%;padding:12px 10px;border:1px solid #cbd5e1;border-radius:14px;font-size:18px;font-weight:900;margin-top:4px}
button{width:100%;border:0;border-radius:16px;padding:15px;font-weight:1000;font-size:16px;background:#111827;color:white;margin-top:10px}
.secondary{background:#e5e7eb;color:#111827}
.result{border:3px solid;position:sticky;top:0;z-index:5;position:sticky}.closeResult{position:absolute;top:10px;right:12px;width:auto;margin:0;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.75);color:inherit;font-size:20px;line-height:1;z-index:10}
.take{background:#ecfdf5;border-color:#86efac;color:#065f46}
.decline{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.soft{background:#fffbeb;border-color:#facc15;color:#92400e}
.verdict{font-size:38px;font-weight:1000;margin:0 0 12px;line-height:1}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summaryMetrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.metric{background:rgba(255,255,255,.75);border-radius:16px;padding:12px}
.metric .k{font-size:11px;font-weight:900;opacity:.75;text-transform:uppercase}
.metric .v{font-size:20px;font-weight:1000;margin-top:2px}
.status{text-align:center;font-weight:900;color:#334155}
.ocr{max-height:100px;overflow:auto;white-space:pre-wrap;font-size:12px;background:#f1f5f9;padding:10px;border-radius:14px}
.historyItem{cursor:pointer;background:#f8fafc;border-radius:14px;padding:12px;margin:8px 0;font-size:14px;border:1px solid #e5e7eb}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:900;margin-right:5px}
.bTake{background:#dcfce7;color:#166534}.bSkip{background:#fee2e2;color:#991b1b}.bVerdict{background:#e0e7ff;color:#3730a3}
.detailOverlay{position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:99;display:none;align-items:flex-end}
.detailPanel{width:100%;max-height:88vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:16px}
.detailImg{width:100%;max-height:430px;object-fit:contain;background:#eef2f7;border-radius:16px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Spark Analyzer</h1>
<div class="version">VERSION 11 - OCR QUALITY</div>
<p class="note">V11: Better OCR quality, card isolation, and original-resolution upload reading.</p>

<div id="result" class="card result" style="display:none"></div>

<div class="card">
<label class="upload">📸 Analyze Screenshot<input id="file" type="file" accept="image/*"></label>
<p class="tiny">Main screen and detail screen supported. Verify fields if needed.</p>
<img id="preview" style="display:none">
<p id="status" class="status"></p>
<div id="ocr" class="ocr" style="display:none"></div>
</div>

<div class="card">
<h2>Check / Fix Details</h2>
<div class="grid">
<div><label class="small">Pay $</label><input id="pay" type="number" step="0.01"></div>
<div><label class="small">Miles</label><input id="miles" type="number" step="0.1"></div>
<div><label class="small">Total Mins</label><input id="minutes" type="number" step="1"></div>
</div>
<div class="grid" style="margin-top:8px">
<div><label class="small">Stops</label><input id="stops" type="number" step="1"></div>
<div><label class="small">Items</label><input id="items" type="number" step="1"></div>
<div></div>
</div>
<button onclick="analyze()">Recalculate</button>
<button onclick="clearForNext()" class="secondary">Ready for Next Screenshot</button>
</div>

<div class="card">
<h2>My Order Tracker</h2>
<div id="summary" class="summaryMetrics"></div>
<div id="history"></div>
</div>
</div>

<div id="detailOverlay" class="detailOverlay" onclick="closeDetail(event)">
<div class="detailPanel" onclick="event.stopPropagation()">
<div id="detailContent"></div>
<button onclick="hideDetail()">Close</button>
</div>
</div>

<script>
let currentResult=null,currentImageData=null;
const el=id=>document.getElementById(id);
const money=n=>"$"+Number(n).toFixed(2);

el("file").addEventListener("change",async e=>{
 const file=e.target.files&&e.target.files[0];
 if(!file)return;
 await processFile(file);
 e.target.value="";
});

["pay","miles","minutes","stops","items"].forEach(id=>{
 el(id).addEventListener("input",analyze);
});

function fileToDataURL(file){
 return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(r.result);
  r.onerror=rej;
  r.readAsDataURL(file);
 });
}

function loadImageFromDataURL(dataUrl){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=reject;
   img.src=dataUrl;
 });
}

function makeCropCanvas(img, crop){
 const w=img.naturalWidth||img.width;
 const h=img.naturalHeight||img.height;

 const sx=Math.max(0, Math.floor(w*crop.x));
 const sy=Math.max(0, Math.floor(h*crop.y));
 const sw=Math.min(w-sx, Math.floor(w*crop.w));
 const sh=Math.min(h-sy, Math.floor(h*crop.h));

 const scale=crop.scale || 3;
 const canvas=document.createElement("canvas");
 canvas.width=sw*scale;
 canvas.height=sh*scale;

 const ctx=canvas.getContext("2d", {willReadFrequently:true});
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality="high";
 ctx.fillStyle="white";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);

 // Contrast + grayscale preprocessing for OCR.
 const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
 const d=imageData.data;
 for(let i=0;i<d.length;i+=4){
   let gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];

   // Increase contrast without fully destroying light blue Spark banner.
   gray=(gray-128)*1.35+128;

   if(gray>245) gray=255;
   if(gray<25) gray=0;

   d[i]=d[i+1]=d[i+2]=Math.max(0,Math.min(255,gray));
 }
 ctx.putImageData(imageData,0,0);

 return canvas;
}

async function recognizeCanvas(canvas){
 const {data}=await Tesseract.recognize(canvas.toDataURL("image/png"),"eng",{
   tessedit_pageseg_mode:"6",
   preserve_interword_spaces:"1"
 });
 return data;
}

function scoreOCRText(text){
 const s=clean(text);
 let score=0;
 if(/\$\s*\d{1,3}\.\d{2}/.test(s)) score+=5;
 if(/\d+\s*stops?/i.test(s)) score+=3;
 if(/\d+(?:\.\d+)?\s*miles?/i.test(s)) score+=3;
 if(/(\d+\s*(?:hr|hrs|hour|hours)|\d+\s*(?:min|mins|minute|minutes))/i.test(s)) score+=3;
 if(/estimated\s+total/i.test(s)) score+=2;
 if(/just\s+for\s+you/i.test(s)) score+=1;
 return score;
}

async function getBestOCRFromOriginalImage(dataUrl){
 const img=await loadImageFromDataURL(dataUrl);

 // Multiple original-resolution crops.
 // This avoids reading the tiny preview and gives OCR a better card-only area.
 const crops=[
   // Main page card area: bottom/middle where visible offers usually sit.
   {name:"main-card-wide", x:0.02, y:0.26, w:0.96, h:0.66, scale:3},
   // Full main lower area if the card sits lower.
   {name:"main-lower", x:0.02, y:0.34, w:0.96, h:0.58, scale:3},
   // Detail page: most of screen below header.
   {name:"detail-page", x:0.02, y:0.08, w:0.96, h:0.82, scale:3},
   // Full image fallback, still enlarged.
   {name:"full", x:0.00, y:0.00, w:1.00, h:1.00, scale:2}
 ];

 let best={score:-1,text:"",lines:[],name:""};
 let debug=[];

 for(const crop of crops){
   try{
     const canvas=makeCropCanvas(img,crop);
     const data=await recognizeCanvas(canvas);
     const text=data.text||"";
     const score=scoreOCRText(text);
     debug.push("[" + crop.name + " score " + score + "]\n" + text.trim());
     if(score>best.score){
       best={score,text,lines:data.lines||[],name:crop.name};
     }
   }catch(e){
     debug.push("[" + crop.name + " failed]");
   }
 }

 best.debug=debug.join("\n\n---\n\n");
 return best;
}

async function processFile(file){
 clearFieldsOnly();
 currentImageData=await fileToDataURL(file);

 // Preview stays small visually, but OCR uses currentImageData at original resolution.
 const url=URL.createObjectURL(file);
 el("preview").src=url;
 el("preview").style.display="block";
 el("status").textContent="Reading original screenshot...";

 try{
   const best=await getBestOCRFromOriginalImage(currentImageData);

   el("ocr").style.display="block";
   el("ocr").textContent=best.debug || best.text || "No text detected.";

   fillFromText(best.text, best.lines || []);
   analyze();

   el("status").textContent="Done using " + best.name + " crop. Verify fields if needed.";
 }catch(err){
   el("status").textContent="OCR failed. Type numbers manually.";
 }
}


function clean(s){
 return String(s||"")
 .replace(/[•·|]/g," • ")
 .replace(/[–—-]/g," • ")
 .replace(/,/g," , ")
 .replace(/\s+/g," ")
 .trim();
}

function parseTime(s){
 s=clean(s).toLowerCase();
 let m=s.match(/(\d+)\s*(?:hr|hrs|hour|hours).*?(\d+)\s*(?:min|mins|minute|minutes)/i);
 if(m)return parseInt(m[1])*60+parseInt(m[2]);
 m=s.match(/(\d+)\s*(?:hr|hrs|hour|hours)/i);
 if(m)return parseInt(m[1])*60;
 m=s.match(/(\d+)\s*(?:min|mins|minute|minutes)/i);
 if(m)return parseInt(m[1]);
 return null;
}

function formatDuration(totalMinutes){
 const mins=Math.round(Number(totalMinutes||0));
 if(mins<60)return `${mins} mins`;
 const h=Math.floor(mins/60),m=mins%60;
 return m?`${h} hr ${m} mins`:`${h} hr`;
}

function parseRoute(s){
 s=clean(s);

 let m=s.match(/(\d+)\s*stops?.{0,90}?(\d+(?:\.\d+)?)\s*miles?.{0,90}?((?:\d+\s*(?:hr|hrs|hour|hours).*?)?\d+\s*(?:min|mins|minute|minutes)|\d+\s*(?:hr|hrs|hour|hours))/i);
 if(!m)m=s.match(/(\d+)\s*stops?.{0,90}?(\d+(?:\.\d+)?)\s*mile\b.{0,90}?((?:\d+\s*(?:hr|hrs|hour|hours).*?)?\d+\s*(?:min|mins|minute|minutes)|\d+\s*(?:hr|hrs|hour|hours))/i);
 if(!m)return null;

 const minutes=parseTime(m[3]);
 if(minutes==null)return null;

 return {
   stops:parseInt(m[1]),
   miles:parseFloat(m[2]),
   minutes
 };
}

function parseItems(s){
 const m=clean(s).match(/(\d+)\s*items?/i);
 return m?parseInt(m[1]):null;
}

function validPrice(s){
 const m=String(s||"").match(/\$\s*(\d{1,3}\.\d{2})/);
 return m?parseFloat(m[1]):null;
}

function lineText(line){
 return clean(line && line.text ? line.text : "");
}

function lineBox(line,idx){
 const b=line && line.bbox ? line.bbox : {};
 return {
   text:lineText(line),
   y0:typeof b.y0==="number"?b.y0:(typeof b.y==="number"?b.y:idx*20),
   y1:typeof b.y1==="number"?b.y1:(typeof b.y==="number"?b.y+18:idx*20+18),
   x0:typeof b.x0==="number"?b.x0:0,
   x1:typeof b.x1==="number"?b.x1:9999
 };
}

function getLines(text, lines){
 let arr=(lines||[]).map((line,idx)=>lineBox(line,idx)).filter(x=>x.text);

 if(!arr.length){
   arr=String(text||"").split(/\n+/).map((t,idx)=>({
     text:clean(t),y0:idx*20,y1:idx*20+18,x0:0,x1:9999
   })).filter(x=>x.text);
 }

 return arr.sort((a,b)=>a.y0-b.y0 || a.x0-b.x0);
}

function parseDetailPage(s){
 if(!/estimated\s+total/i.test(s))return null;

 const payMatch=s.match(/estimated\s+total.{0,150}?\$\s*(\d{1,3}\.\d{2})/i);
 const pay=payMatch?parseFloat(payMatch[1]):null;
 const route=parseRoute(s);
 const items=parseItems(s);

 if(pay==null && !route)return null;

 return {
   pay,
   stops:route?route.stops:null,
   miles:route?route.miles:null,
   minutes:route?route.minutes:null,
   items
 };
}

function parseMainVisibleCard(text, lines){
 const arr=getLines(text,lines);

 // Find first FULL visible price. Cut-off cards above often have no visible price.
 for(let i=0;i<arr.length;i++){
   const pay=validPrice(arr[i].text);
   if(pay==null)continue;

   const priceY=arr[i].y0;

   // Card zone: only a reasonable area under this price.
   // Stops route line should be very near the price, not in a lower card.
   let cardLines=[];
   for(let j=i;j<arr.length;j++){
     const line=arr[j];

     // Stop at next valid price below.
     if(j>i && validPrice(line.text)!=null)break;

     // Stop after about one offer-card height.
     if(line.y0 - priceY > 330)break;

     cardLines.push(line.text);
   }

   const cardText=cardLines.join(" ");

   // Route must be inside this card zone.
   const route=parseRoute(cardText);

   if(route){
     return {
       pay,
       stops:route.stops,
       miles:route.miles,
       minutes:route.minutes,
       items:parseItems(cardText)
     };
   }

   // Extra fallback: route line may be a single line close to price.
   for(let k=i;k<Math.min(arr.length,i+6);k++){
     const route2=parseRoute(arr.slice(i,k+1).map(x=>x.text).join(" "));
     if(route2){
       return {
         pay,
         stops:route2.stops,
         miles:route2.miles,
         minutes:route2.minutes,
         items:null
       };
     }
   }

   // Return pay only; user can fix miles/time.
   return {pay,stops:null,miles:null,minutes:null,items:null};
 }

 return null;
}


function parseMainByRawTextOrder(text){
 const s=clean(text);

 // Split the OCR text into chunks beginning with each valid price.
 // This helps when visual line order accidentally starts with the lower offer.
 const priceRegex=/\$\s*(\d{1,3}\.\d{2})/g;
 const matches=[...s.matchAll(priceRegex)];
 if(!matches.length)return null;

 for(let idx=0; idx<matches.length; idx++){
   const start=matches[idx].index;
   const end=matches[idx+1] ? matches[idx+1].index : s.length;
   const chunk=s.slice(start,end);
   const pay=parseFloat(matches[idx][1]);
   const route=parseRoute(chunk);

   if(route){
     return {
       pay,
       stops:route.stops,
       miles:route.miles,
       minutes:route.minutes,
       items:parseItems(chunk),
       source:"raw-first-price"
     };
   }

   // If this first visible price has no route, return pay only rather than jumping to lower card.
   if(idx===0){
     return {
       pay,
       stops:null,
       miles:null,
       minutes:null,
       items:null,
       source:"raw-first-price-pay-only"
     };
   }
 }

 return null;
}

function hasCompleteOffer(obj){
 return obj && obj.pay!=null && obj.miles!=null && obj.minutes!=null;
}

function fillFromText(text, lines){
 const s=clean(text);

 const detail=parseDetailPage(s);
 if(detail){
   if(detail.pay!=null)el("pay").value=detail.pay.toFixed(2);
   if(detail.stops!=null)el("stops").value=detail.stops;
   if(detail.miles!=null)el("miles").value=detail.miles;
   if(detail.minutes!=null)el("minutes").value=detail.minutes;
   if(detail.items!=null)el("items").value=detail.items;
   return;
 }

 const rawMain=parseMainByRawTextOrder(text);
 const visualMain=parseMainVisibleCard(text, lines);

 // Main page rule:
 // If raw OCR finds a complete first-price card, use it.
 // This fixes the case where visual lines accidentally start on the lower offer.
 // If raw only finds pay, then use visual ONLY if it has the same pay.
 let chosen=null;

 if(hasCompleteOffer(rawMain)){
   chosen=rawMain;
 } else if(hasCompleteOffer(visualMain)){
   if(rawMain && rawMain.pay!=null && Math.abs(rawMain.pay-visualMain.pay) > 0.01){
     // Do not mix lower-card route with first-card price.
     chosen=rawMain;
   } else {
     chosen=visualMain;
   }
 } else {
   chosen=rawMain || visualMain;
 }

 if(chosen){
   if(chosen.pay!=null)el("pay").value=chosen.pay.toFixed(2);
   if(chosen.stops!=null)el("stops").value=chosen.stops;
   if(chosen.miles!=null)el("miles").value=chosen.miles;
   if(chosen.minutes!=null)el("minutes").value=chosen.minutes;
   if(chosen.items!=null)el("items").value=chosen.items;
 }
}

function hideResult(){
 el("result").style.display="none";
}

function analyze(){
 const pay=parseFloat(el("pay").value);
 const miles=parseFloat(el("miles").value);
 const minutes=parseFloat(el("minutes").value);
 const stops=parseFloat(el("stops").value||0);
 const items=parseFloat(el("items").value||0);

 if(!pay||!miles||!minutes){
   el("result").style.display="none";
   currentResult=null;
   return null;
 }

 const rtMiles=miles*2;
 const rtPerMile=pay/rtMiles;
 const hourly=pay/(minutes/60);

 let verdict="DECLINE";
 let cls="decline";

 if(pay>=miles*4 && hourly>=30 && miles<=5){
   verdict="TAKE";
   cls="take";
 } else if(hourly>=30 && miles<=7){
   verdict="SOFT YES";
   cls="soft";
 }

 currentResult={
  date:new Date().toLocaleString(),
  pay,miles,minutes,stops,items,
  rtMiles,rtPerMile,hourly,
  verdict,
  screenshot:currentImageData
 };

 el("result").className="card result "+cls;
 el("result").style.display="block";
 el("result").innerHTML=`
 <button type="button" class="closeResult" onclick="hideResult()">×</button>
 <p class="verdict">${verdict}</p>
 <div class="metrics">
  <div class="metric"><div class="k">RT Miles</div><div class="v">${rtMiles.toFixed(1)}</div></div>
  <div class="metric"><div class="k">RT $/Mile</div><div class="v">${money(rtPerMile)}</div></div>
  <div class="metric"><div class="k">Hourly</div><div class="v">${money(hourly)}/hr</div></div>
  <div class="metric"><div class="k">Time</div><div class="v">${formatDuration(minutes)}</div></div>
 </div>`;
 return currentResult;
}

function getHistory(){
 try{return JSON.parse(localStorage.getItem("sparkHistoryV8")||"[]")}
 catch{return[]}
}

function saveHistory(h){
 localStorage.setItem("sparkHistoryV8",JSON.stringify(h));
 renderHistory();
}

function renderHistory(){
 const h=getHistory();

 el("summary").innerHTML=`
 <div class="metric"><div class="k">Orders</div><div class="v">${h.length}</div></div>
 <div class="metric"><div class="k">Taken</div><div class="v">${h.filter(x=>x.status==="TAKEN").length}</div></div>
 <div class="metric"><div class="k">Skipped</div><div class="v">${h.filter(x=>x.status==="SKIPPED").length}</div></div>
 `;

 el("history").innerHTML=h.slice(0,20).map((x,i)=>`
 <div class="historyItem" onclick="showDetail(${i})">
 <span class="badge ${x.status==="TAKEN"?"bTake":"bSkip"}">${x.status||"SAVED"}</span>
 <span class="badge bVerdict">${x.verdict}</span>
 <b>${money(x.pay)}</b> • ${x.miles} mi • ${formatDuration(x.minutes)}
 </div>
 `).join("");
}

function showDetail(i){
 const x=getHistory()[i];
 if(!x)return;

 el("detailContent").innerHTML=`
 <h2>Trip Breakdown</h2>
 ${x.screenshot?`<img class="detailImg" src="${x.screenshot}">`:""}
 <div class="metrics">
  <div class="metric"><div class="k">Pay</div><div class="v">${money(x.pay)}</div></div>
  <div class="metric"><div class="k">Hourly</div><div class="v">${money(x.hourly)}/hr</div></div>
  <div class="metric"><div class="k">RT Miles</div><div class="v">${x.rtMiles.toFixed(1)}</div></div>
  <div class="metric"><div class="k">Time</div><div class="v">${formatDuration(x.minutes)}</div></div>
 </div>`;

 el("detailOverlay").style.display="flex";
}

function hideDetail(){
 el("detailOverlay").style.display="none";
}

function closeDetail(e){
 if(e.target.id==="detailOverlay")hideDetail();
}

function clearFieldsOnly(){
 ["pay","miles","minutes","stops","items"].forEach(id=>el(id).value="");
 currentResult=null;
}

function clearForNext(){
 clearFieldsOnly();
 el("preview").style.display="none";
 el("ocr").style.display="none";
 el("result").style.display="none";
 el("status").textContent="";
}

renderHistory();
</script>
</body>
</html>
