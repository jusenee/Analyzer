<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Analyzer v8</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:14px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f6f7fb; color:#111827; }
    .wrap { max-width:500px; margin:0 auto 40px; }
    h1 { font-size:24px; margin:8px 0 2px; text-align:center; }
    h2 { font-size:18px; margin:0 0 12px; }
    p { color:#4b5563; line-height:1.35; }
    .note { font-size:13px; color:#64748b; text-align:center; margin:4px 0 10px; }
    .card { background:white; border-radius:18px; padding:14px; margin:12px 0; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .upload { display:block; border:2px dashed #cbd5e1; border-radius:18px; padding:20px; text-align:center; font-weight:900; background:#fff; font-size:18px; }
    input[type=file] { display:none; }
    img { width:100%; max-height:300px; object-fit:contain; border-radius:14px; background:#eef2f7; margin-top:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label.small { font-size:11px; font-weight:900; color:#475569; text-transform:uppercase; letter-spacing:.02em; }
    input[type=number], input[type=text] { width:100%; padding:12px 10px; border:1px solid #cbd5e1; border-radius:12px; font-size:18px; margin-top:4px; font-weight:800; }
    button { width:100%; border:0; border-radius:14px; padding:14px; font-weight:950; font-size:16px; background:#111827; color:white; margin-top:9px; }
    .secondary { background:#e5e7eb; color:#111827; }
    .danger { background:#fee2e2; color:#991b1b; }
    .green { background:#16a34a; color:white; }
    .red { background:#dc2626; color:white; }
    .toggle { background:#e5e7eb; color:#111827; }
    .toggle.on { background:#fde68a; color:#111827; }
    .result { border:2px solid; position:sticky; top:0; z-index:2; }
    .take { background:#ecfdf5; border-color:#86efac; color:#065f46; }
    .soft { background:#fffbeb; border-color:#fde68a; color:#92400e; }
    .decline { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
    .verdict { font-size:32px; font-weight:1000; margin:0; line-height:1; }
    .reason { margin:6px 0 0; font-weight:800; color:inherit; }
    .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
    .result .metrics { grid-template-columns:1fr 1fr; }
    .metric { background:rgba(255,255,255,.72); border-radius:14px; padding:10px; }
    .metric .k { font-size:11px; opacity:.75; font-weight:900; text-transform:uppercase; }
    .metric .v { font-size:16px; font-weight:1000; margin-top:2px; }
    .ocr { max-height:105px; overflow:auto; white-space:pre-wrap; font-size:12px; background:#f1f5f9; padding:10px; border-radius:12px; }
    .status { font-size:14px; font-weight:900; text-align:center; color:#334155; }
    .historyItem { border-top:1px solid #e5e7eb; padding:10px 0; font-size:14px; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:900; margin-right:5px; }
    .bTake { background:#dcfce7; color:#166534; }
    .bSkip { background:#fee2e2; color:#991b1b; }
    .bVerdict { background:#e0e7ff; color:#3730a3; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .tab { background:#e5e7eb; color:#111827; margin-top:0; }
    .tab.active { background:#111827; color:white; }
    .tiny { font-size:12px; color:#64748b; margin:6px 0 0; }
    .historyItem { cursor:pointer; border-radius:12px; padding:12px; margin:8px 0; background:#f8fafc; }
    .historyItem:active { transform:scale(.99); }
    .detailOverlay { position:fixed; inset:0; background:rgba(15,23,42,.62); z-index:99; display:none; align-items:flex-end; }
    .detailPanel { width:100%; max-height:88vh; overflow:auto; background:white; border-radius:22px 22px 0 0; padding:16px; }
    .detailImg { width:100%; max-height:430px; object-fit:contain; background:#eef2f7; border-radius:16px; margin:12px 0; }
    .closeBtn { background:#111827; color:white; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Spark Analyzer v8</h1>
  <p class="note">Clickable trip history with screenshot and full breakdown.</p>

  <div id="result" class="card result" style="display:none;"></div>

  <div class="card">
    <div class="tabs">
      <button id="tabScreen" class="tab active" onclick="setMode('screen')">Screenshot</button>
      <button id="tabSpeed" class="tab" onclick="setMode('speed')">Speed Input</button>
    </div>

    <div id="screenMode">
      <label class="upload">
        📸 Upload Spark Screenshot
        <input id="file" type="file" accept="image/*" />
      </label>
      <p class="tiny">Best for main screen cards. It reads the first/top visible offer only.</p>
      <img id="preview" style="display:none;" />
      <p id="status" class="status"></p>
      <div id="ocr" class="ocr" style="display:none;"></div>
    </div>

    <div id="speedMode" style="display:none;">
      <h2>Speed Input</h2>
      <p class="tiny">For disappearing offers: type only pay, miles, and minutes.</p>
    </div>
  </div>

  <div class="card">
    <h2>Offer Details</h2>
    <div class="grid">
      <div><label class="small">Pay $</label><input id="pay" type="number" step="0.01" placeholder="25"></div>
      <div><label class="small">Miles</label><input id="miles" type="number" step="0.1" placeholder="5"></div>
      <div><label class="small">Minutes</label><input id="minutes" type="number" step="1" placeholder="30"></div>
    </div>
    <div class="grid" style="margin-top:8px;">
      <div><label class="small">Stops</label><input id="stops" type="number" step="1" placeholder="2"></div>
      <div><label class="small">Items</label><input id="items" type="number" step="1" placeholder="optional"></div>
      <button id="apt" class="toggle" type="button">Apt: No</button>
    </div>
    <button onclick="analyze()">Analyze</button>
    <button onclick="clearForNext()" class="secondary">Clear for Next Order</button>
  </div>

  <div class="card">
    <h2>Did you take this order?</h2>
    <div class="grid2">
      <button class="green" onclick="logOrder('TAKEN')">Yes, I took it</button>
      <button class="red" onclick="logOrder('SKIPPED')">No, I skipped it</button>
    </div>
  </div>

  <div class="card">
    <h2>My Order Tracker</h2>
    <div id="summary" class="metrics"></div>
    <button onclick="exportHistory()" class="secondary">Copy History CSV</button>
    <button onclick="clearHistory()" class="danger">Clear History</button>
    <div id="history"></div>
  </div>
</div>

<div id="detailOverlay" class="detailOverlay" onclick="closeDetail(event)">
  <div class="detailPanel" onclick="event.stopPropagation()">
    <div id="detailContent"></div>
    <button class="closeBtn" onclick="hideDetail()">Close</button>
  </div>
</div>

<script>
let apartment = false;
let currentResult = null;
let currentImageData = null;
let mode = "screen";

const el = id => document.getElementById(id);
const money = n => "$" + Number(n).toFixed(2);

function setMode(m) {
  mode = m;
  el("screenMode").style.display = m === "screen" ? "block" : "none";
  el("speedMode").style.display = m === "speed" ? "block" : "none";
  el("tabScreen").className = "tab" + (m === "screen" ? " active" : "");
  el("tabSpeed").className = "tab" + (m === "speed" ? " active" : "");
}

el("apt").onclick = function() {
  apartment = !apartment;
  updateAptButton();
  analyze();
};

["pay","miles","minutes","stops","items"].forEach(id => el(id).addEventListener("input", analyze));

el("file").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  await processFile(file);
  e.target.value = "";
});

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function processFile(file) {
  clearFieldsOnly();
  const url = URL.createObjectURL(file);
  currentImageData = await fileToDataURL(file);
  el("preview").src = url;
  el("preview").style.display = "block";
  el("result").style.display = "none";
  el("ocr").style.display = "none";
  el("ocr").textContent = "";
  el("status").textContent = "Reading screenshot...";

  try {
    const { data } = await Tesseract.recognize(file, "eng");
    const text = data.text || "";
    el("ocr").style.display = "block";
    el("ocr").textContent = text || "No text detected.";
    fillFromText(text);
    el("status").textContent = "Done. It read the top offer first. Verify fields.";
    analyze();
  } catch (err) {
    el("status").textContent = "OCR failed. Use speed input fields.";
  }
}

function extractMoneyCandidates(text) {
  let candidates = [...text.matchAll(/\$\s?(\d+(?:\.\d{1,2})?)/g)].map(m => ({
    value: parseFloat(m[1]),
    index: m.index,
    raw: m[0]
  }));

  // Sometimes OCR drops the $ but keeps "73.95 estimate"
  const estimateMatches = [...text.matchAll(/\b(\d{1,3}(?:\.\d{2}))\s?(?:estimate|estimated|total)\b/ig)].map(m => ({
    value: parseFloat(m[1]),
    index: m.index,
    raw: m[0]
  }));

  candidates = candidates.concat(estimateMatches)
    .filter(x => x.value > 0)
    .sort((a, b) => a.index - b.index);

  return candidates;
}

function parseTimeToMinutes(hoursText, minutesText) {
  const h = hoursText ? parseInt(hoursText, 10) : 0;
  const m = minutesText ? parseInt(minutesText, 10) : 0;
  return (h * 60) + m;
}

function formatDuration(totalMinutes) {
  const mins = Math.round(Number(totalMinutes || 0));
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h} hr ${m} min` : `${h} hr`;
}

function normalizeText(text) {
  return text
    .replace(/,/g, " ")
    .replace(/[•·]/g, " • ")
    .replace(/[|]/g, " • ")
    .replace(/\s+/g, " ")
    .replace(/\bO\b/g, "0")
    .trim();
}

function getTopOfferSlice(cleaned) {
  // Works for main-screen card. If there are two visible offers, cut before the second price.
  let start = cleaned.search(/just\s+for\s+you/i);
  if (start < 0) start = cleaned.search(/estimated\s+total/i);
  if (start < 0) start = cleaned.search(/\$\s?\d+(?:\.\d{1,2})?/);
  if (start < 0) start = 0;

  let slice = cleaned.slice(start);
  const dollars = [...slice.matchAll(/\$\s?\d+(?:\.\d{1,2})?/g)].map(m => m.index);

  // Main page can show two offer cards. In detail pages, multiple dollar values are delivery/tip, so do NOT cut if Estimated Total appears.
  const hasEstimatedTotal = /estimated\s+total/i.test(slice);
  if (!hasEstimatedTotal && dollars.length >= 2) {
    slice = slice.slice(0, dollars[1]);
  }

  return slice;
}

function parseHeaderFromText(text) {
  // Handles:
  // 3 stops • 5.8 miles • 41 mins
  // 19 stops • 45 miles • 2 hrs, 38 mins
  // 4 stops • 12.2 miles • 1 hr
  // 2 stops • 1 mile • 22 mins
  const patterns = [
    /(\d+)\s?stops?.{0,35}?(\d+(?:\.\d+)?)\s?miles?.{0,35}?(?:(\d+)\s?(?:hr|hrs|hour|hours)\s*)?(?:(\d+)\s?(?:min|mins|minute|minutes))?/i,
    /(\d+)\s?stops?.{0,35}?(\d+(?:\.\d+)?)\s?mile\b.{0,35}?(?:(\d+)\s?(?:hr|hrs|hour|hours)\s*)?(?:(\d+)\s?(?:min|mins|minute|minutes))?/i
  ];

  for (const pattern of patterns) {
    const m = text.match(pattern);
    if (m) {
      const hasTime = m[3] || m[4];
      if (!hasTime) continue;
      return {
        stops: m[1],
        miles: m[2],
        minutes: parseTimeToMinutes(m[3], m[4])
      };
    }
  }

  return null;
}

function parsePayFromText(top, cleaned) {
  // Detail page: "Estimated Total ... $27.02" is the most trustworthy.
  const estimatedTotal = cleaned.match(/estimated\s+total.{0,80}?\$\s?(\d+(?:\.\d{1,2})?)/i);
  if (estimatedTotal) return parseFloat(estimatedTotal[1]);

  const topEstimatedTotal = top.match(/estimated\s+total.{0,80}?\$\s?(\d+(?:\.\d{1,2})?)/i);
  if (topEstimatedTotal) return parseFloat(topEstimatedTotal[1]);

  // Main page: first price in top visible card.
  const topMoney = extractMoneyCandidates(top);
  if (topMoney.length) return topMoney[0].value;

  const allMoney = extractMoneyCandidates(cleaned);
  if (allMoney.length) return allMoney[0].value;

  return null;
}

function fillFromText(text) {
  const cleaned = normalizeText(text);
  const top = getTopOfferSlice(cleaned);

  const payValue = parsePayFromText(top, cleaned);
  if (payValue) el("pay").value = payValue.toFixed(2);

  // Detail pages often have route summary ABOVE "Just for you", so check whole OCR first.
  const parsedHeader = parseHeaderFromText(cleaned) || parseHeaderFromText(top);
  if (parsedHeader) {
    el("stops").value = parsedHeader.stops;
    el("miles").value = parsedHeader.miles;
    el("minutes").value = parsedHeader.minutes;
  } else {
    const mileMatch = cleaned.match(/(\d+(?:\.\d+)?)\s?(?:mi|mile|miles)\b/i);
    const minMatch = cleaned.match(/(\d+)\s?(?:min|mins|minute|minutes)\b/i);
    const hrOnlyMatch = cleaned.match(/(\d+)\s?(?:hr|hrs|hour|hours)\b/i);
    const stopMatch = cleaned.match(/(\d+)\s?(?:stop|stops)\b/i);

    if (mileMatch) el("miles").value = mileMatch[1];
    if (hrOnlyMatch && !minMatch) el("minutes").value = parseInt(hrOnlyMatch[1], 10) * 60;
    else if (minMatch) el("minutes").value = minMatch[1];
    if (stopMatch) el("stops").value = stopMatch[1];
  }

  // Prefer item count in detail section, e.g. "32 items (47 qty)"
  const itemMatches = [...cleaned.matchAll(/(\d+)\s?(?:item|items)\b/ig)]
    .map(m => parseInt(m[1],10))
    .filter(n => n > 0);
  if (itemMatches.length) el("items").value = Math.max(...itemMatches);

  apartment = /apartment|apt|unit|building|floor/i.test(cleaned);
  updateAptButton();
}

function updateAptButton() {
  el("apt").textContent = "Apt: " + (apartment ? "Yes" : "No");
  el("apt").className = "toggle" + (apartment ? " on" : "");
}

function analyze() {
  const pay = parseFloat(el("pay").value);
  const miles = parseFloat(el("miles").value);
  const minutes = parseFloat(el("minutes").value);
  const stops = parseFloat(el("stops").value || "0");
  const items = parseFloat(el("items").value || "0");

  if (!pay || !miles || !minutes) {
    currentResult = null;
    el("result").style.display = "none";
    return;
  }

  const roundTripMiles = miles * 2;
  const minPayByMiles = miles * 4;
  const oneWayPerMile = pay / miles;
  const roundTripPerMile = pay / roundTripMiles;
  const hourly = pay / (minutes / 60);
  const maxMinutesFor30 = pay * 2;

  const passesMileage = pay >= minPayByMiles;
  const passesHourly = hourly >= 30;
  const local = miles <= 5;
  const quick = minutes <= 25;
  const softDistance = miles > 5 && miles <= 7 && quick && pay >= 20;
  const risky = apartment || stops >= 3 || items >= 40;

  let verdict = "DECLINE", cls = "decline", reason = "Fails your pay, time, or distance rules.";

  if (passesMileage && passesHourly && local && !risky) {
    verdict = "TAKE"; cls = "take";
    reason = "Meets your round-trip $2/mile rule, hits $30/hr+, and stays local.";
  } else if (passesMileage && passesHourly && (local || softDistance)) {
    verdict = "SOFT YES"; cls = "soft";
    reason = risky ? "Money works, but stops/items/apartment risk may slow you down." : "Money works, but it is slightly outside your ideal zone.";
  } else if (hourly >= 30 && quick && pay >= 15) {
    verdict = "SOFT YES"; cls = "soft";
    reason = "Hourly pace is good, but it may not fully satisfy your round-trip mileage rule.";
  }

  currentResult = {
    date: new Date().toLocaleString(),
    pay, miles, minutes, stops, items, apartment,
    roundTripMiles, minPayByMiles, oneWayPerMile, roundTripPerMile, hourly, maxMinutesFor30,
    verdict, reason,
    screenshot: currentImageData
  };

  el("result").className = "card result " + cls;
  el("result").style.display = "block";
  el("result").innerHTML = `
    <p class="verdict">${verdict}</p>
    <div class="metrics">
      <div class="metric"><div class="k">RT Miles</div><div class="v">${roundTripMiles.toFixed(1)}</div></div>
      <div class="metric"><div class="k">RT $/Mile</div><div class="v">${money(roundTripPerMile)}</div></div>
      <div class="metric"><div class="k">Hourly</div><div class="v">${money(hourly)}/hr</div></div>
      <div class="metric"><div class="k">Time</div><div class="v">${formatDuration(minutes)}</div></div>
    </div>
  `;
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem("sparkHistoryV4") || "[]"); }
  catch { return []; }
}

function saveHistory(history) {
  localStorage.setItem("sparkHistoryV4", JSON.stringify(history));
  renderHistory();
}

function logOrder(status) {
  if (!currentResult) {
    alert("Analyze an order first.");
    return;
  }
  const history = getHistory();
  history.unshift({ ...currentResult, status, id: Date.now() });
  saveHistory(history);
  clearForNext();
}

function renderHistory() {
  const history = getHistory();
  const taken = history.filter(x => x.status === "TAKEN");
  const skipped = history.filter(x => x.status === "SKIPPED");
  const avgTakenHourly = taken.length ? taken.reduce((a,b) => a + b.hourly, 0) / taken.length : 0;
  const totalTakenPay = taken.reduce((a,b) => a + b.pay, 0);

  el("summary").innerHTML = `
    <div class="metric"><div class="k">Analyzed</div><div class="v">${history.length}</div></div>
    <div class="metric"><div class="k">Taken</div><div class="v">${taken.length}</div></div>
    <div class="metric"><div class="k">Skipped</div><div class="v">${skipped.length}</div></div>
    <div class="metric"><div class="k">Taken Pay</div><div class="v">${money(totalTakenPay)}</div></div>
    <div class="metric"><div class="k">Avg Taken/hr</div><div class="v">${taken.length ? money(avgTakenHourly) : "$0.00"}</div></div>
    <div class="metric"><div class="k">Take Rate</div><div class="v">${history.length ? Math.round(taken.length/history.length*100) : 0}%</div></div>
  `;

  el("history").innerHTML = history.slice(0, 25).map((x, idx) => `
    <div class="historyItem" onclick="showDetail(${idx})">
      <span class="badge ${x.status === "TAKEN" ? "bTake" : "bSkip"}">${x.status}</span>
      <span class="badge bVerdict">${x.verdict}</span>
      <b>${money(x.pay)}</b> • ${x.miles} mi • ${formatDuration(x.minutes)} • ${money(x.hourly)}/hr
      <div class="tiny">Tap to view screenshot + breakdown</div>
      <div class="tiny">${x.date} ${x.apartment ? "• Apartment" : ""} ${x.items ? "• " + x.items + " items" : ""}</div>
    </div>
  `).join("");
}

function showDetail(index) {
  const history = getHistory();
  const x = history[index];
  if (!x) return;

  const imgHtml = x.screenshot
    ? `<img class="detailImg" src="${x.screenshot}" alt="Saved order screenshot">`
    : `<div class="card secondary">No screenshot saved for this order.</div>`;

  el("detailContent").innerHTML = `
    <h2>Trip Breakdown</h2>
    <p>
      <span class="badge ${x.status === "TAKEN" ? "bTake" : "bSkip"}">${x.status}</span>
      <span class="badge bVerdict">${x.verdict}</span>
    </p>
    ${imgHtml}
    <div class="metrics">
      <div class="metric"><div class="k">Pay</div><div class="v">${money(x.pay)}</div></div>
      <div class="metric"><div class="k">Time</div><div class="v">${formatDuration(x.minutes)}</div></div>
      <div class="metric"><div class="k">Hourly</div><div class="v">${money(x.hourly)}/hr</div></div>
      <div class="metric"><div class="k">Miles</div><div class="v">${Number(x.miles).toFixed(1)}</div></div>
      <div class="metric"><div class="k">RT Miles</div><div class="v">${Number(x.roundTripMiles).toFixed(1)}</div></div>
      <div class="metric"><div class="k">RT $/Mile</div><div class="v">${money(x.roundTripPerMile)}</div></div>
      <div class="metric"><div class="k">Stops</div><div class="v">${x.stops || 0}</div></div>
      <div class="metric"><div class="k">Items</div><div class="v">${x.items || "—"}</div></div>
      <div class="metric"><div class="k">Apartment</div><div class="v">${x.apartment ? "Yes" : "No"}</div></div>
    </div>
    <p class="tiny">${x.date}</p>
    <p class="tiny">${x.reason || ""}</p>
  `;
  el("detailOverlay").style.display = "flex";
}

function hideDetail() {
  el("detailOverlay").style.display = "none";
}

function closeDetail(event) {
  if (event.target.id === "detailOverlay") hideDetail();
}

function exportHistory() {
  const history = getHistory();
  if (!history.length) {
    alert("No history yet.");
    return;
  }
  const rows = [
    ["date","status","verdict","pay","miles","minutes","stops","items","apartment","hourly","oneWayPerMile","roundTripPerMile"],
    ...history.map(x => [x.date,x.status,x.verdict,x.pay,x.miles,x.minutes,x.stops,x.items,x.apartment,x.hourly.toFixed(2),x.oneWayPerMile.toFixed(2),x.roundTripPerMile.toFixed(2)])
  ];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  navigator.clipboard.writeText(csv).then(() => alert("History CSV copied."));
}

function clearHistory() {
  if (confirm("Clear all saved order history?")) {
    localStorage.removeItem("sparkHistoryV4");
    renderHistory();
  }
}

function clearFieldsOnly() {
  ["pay","miles","minutes","stops","items"].forEach(id => el(id).value = "");
  apartment = false;
  updateAptButton();
  currentResult = null;
  currentImageData = null;
}

function clearForNext() {
  clearFieldsOnly();
  el("preview").style.display = "none";
  el("ocr").style.display = "none";
  el("ocr").textContent = "";
  el("status").textContent = "";
  el("result").style.display = "none";
  el("file").value = "";
}
